<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#D45B0A"/>
    </linearGradient>
    <linearGradient id="folder1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D8"/>
    </linearGradient>
    <linearGradient id="folder2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5EB"/>
      <stop offset="100%" stop-color="#E0D0C0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE0C0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="20" y="20" width="984" height="984" rx="200" ry="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Back folder (larger, behind, slightly left and up) -->
  <g filter="url(#shadow)" transform="translate(140, 240)">
    <!-- Folder body -->
    <rect x="0" y="60" width="340" height="260" rx="24" ry="24" fill="url(#folder2)" opacity="0.85"/>
    <!-- Folder tab -->
    <path d="M24,60 L24,36 Q24,12 48,12 L140,12 Q158,12 168,36 L180,60 Z" fill="url(#folder2)" opacity="0.85"/>
  </g>

  <!-- Front folder (slightly right and down, overlapping) -->
  <g filter="url(#shadow)" transform="translate(340, 320)">
    <!-- Folder body -->
    <rect x="0" y="60" width="380" height="290" rx="26" ry="26" fill="url(#folder1)"/>
    <!-- Folder tab -->
    <path d="M26,60 L26,34 Q26,10 52,10 L155,10 Q175,10 185,34 L200,60 Z" fill="url(#folder1)"/>
    <!-- Lines on folder to suggest contents -->
    <rect x="50" y="130" width="200" height="14" rx="7" fill="#D45B0A" opacity="0.25"/>
    <rect x="50" y="165" width="260" height="14" rx="7" fill="#D45B0A" opacity="0.18"/>
    <rect x="50" y="200" width="160" height="14" rx="7" fill="#D45B0A" opacity="0.12"/>
  </g>

  <!-- Curved arrow from back folder to front folder -->
  <g filter="url(#shadowSm)">
    <path d="M340,380 C260,320 280,260 380,250 C440,244 480,270 500,310"
          fill="none" stroke="url(#arrow)" stroke-width="28" stroke-linecap="round" opacity="0.95"/>
    <!-- Arrowhead -->
    <polygon points="490,280 520,320 480,330" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Small decorative arrow (top right) suggesting export/sort -->
  <g transform="translate(680, 180)" opacity="0.6">
    <line x1="0" y1="40" x2="60" y2="0" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <polygon points="48,-12 72,-4 56,16" fill="#FFFFFF"/>
  </g>
</svg>

